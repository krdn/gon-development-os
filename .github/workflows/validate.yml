name: Validate and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - run: npm ci
      - run: python3 -m pip install -r requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk poppler-utils
      - run: npm run verify:all
      - run: npm run build:all
      - run: npm test
      - name: 생성 문서의 원본 반영 여부 확인
        run: git diff --exit-code -- docs/01-manual.md dist/01-project-workflow-manual.html guides/herdr/index.html guides/herdr/steps.json guides/herdr/planning-steps.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gon-development-os-${{ github.sha }}
          path: |
            dist/
            evidence/build.json
            evidence/workflow-bundle.json
            guides/gon-beginner-workflow.zip
          retention-days: 30
